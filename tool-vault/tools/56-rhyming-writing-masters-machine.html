<header><h1>RHYMING WRITING MASTERS MACHINE</h1><div class="subtitle">Generate, grade, approve, reject, sort, dedupe, export A–Z alliterations and rhyming word lists.</div></header>
<main class="wrap">
<section class="card"><h2>Create</h2><label>Name / seed / theme</label><input id="seed" value="Rhyme" /><label>Target letter</label><select id="letter"><option value="ALL">ALL A–Z</option></select><label>Mode</label><select id="mode"><option value="clean">Clean</option><option value="sacred">Sacred / poetic</option><option value="rap">Rap cadence</option><option value="title">Title maker</option><option value="wordlist">Rhyming word lists</option></select><label>How many per letter / group</label><input id="count" type="number" min="1" max="50" value="5" /><button class="primary" onclick="generate()">Generate</button><button onclick="sortResults()">Sort</button><button onclick="dedupeResults()">Dedupe</button><button class="danger" onclick="clearResults()">Clear Results</button><hr /><div class="small" id="status">Ready. Embedded database loaded.</div></section>
<section class="card"><h2>Library</h2><button class="gold" onclick="exportTXT()">Export TXT</button><button class="gold" onclick="exportCSV()">Export CSV</button><button class="gold" onclick="exportJSON()">Export JSON</button><button onclick="saveLocal()">Save</button><button onclick="loadLocal()">Load</button><button class="danger" onclick="clearAll()">Clear All</button><label>Import CSV / JSON</label><input type="file" id="fileInput" accept=".csv,.json,.txt" onchange="importFile(event)"><div class="stats"><div class="stat"><b>Results</b><span id="resultsCount">0</span></div><div class="stat"><b>Approved</b><span id="approvedCount">0</span></div><div class="stat"><b>Rejected</b><span id="rejectedCount">0</span></div><div class="stat"><b>Words</b><span id="wordCount">0</span></div></div></section>
<section class="card"><h2>A–Z Index</h2><div class="index" id="index"></div></section>
<section class="card results"><h2>Results</h2><div class="resultbar"><button onclick="approveVisible()">Approve Visible</button><button class="danger" onclick="rejectVisible()">Reject Visible</button><span class="small">Click individual cards to toggle approved.</span></div><div class="list" id="results"></div></section>
</main>

<script>
const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let db = []; let results = []; let rejected = []; let approved = [];
function parseEmbedded(){ try { db = JSON.parse(document.getElementById('embedded-data').textContent); } catch(e) { db=[]; } db = db.map(normalizeRecord).filter(r=>r.word); }
function normalizeRecord(r){ const word=String(r.word||'').trim().toUpperCase(); return {word, rhyme_key:String(r.rhyme_key||r.rhymeKey||word.slice(-3)).trim().toUpperCase(), first_letter:String(r.first_letter||r.firstLetter||word[0]||'').trim().toUpperCase(), length:Number(r.length||word.length), source:String(r.source||'import'), status:String(r.status||'seed')}; }
function init(){ parseEmbedded(); const sel=document.getElementById('letter'); alphabet.forEach(l=>{ const o=document.createElement('option'); o.value=l; o.textContent=l; sel.appendChild(o); }); updateIndex(); updateStats(); }
function wordsForLetter(l){ return db.filter(r=>r.first_letter===l); }
function groupsForLetter(l){ const map={}; wordsForLetter(l).forEach(r=>{ (map[r.rhyme_key] ||= []).push(r.word); }); return Object.entries(map).sort((a,b)=>b[1].length-a[1].length || a[0].localeCompare(b[0])); }
function cleanSeed(){ return (document.getElementById('seed').value||'RHYME').trim(); }
function makePhrase(letter, group, words, mode, seed){ const pick=words.slice(0, Math.min(words.length,5)); const chain=pick.join(' • '); if(mode==='wordlist') return `${letter} / ${group}: ${chain}`; if(mode==='sacred') return `${letter}-lit ${seed}: ${pick.join(', ')} — words woven in wonder`; if(mode==='rap') return `${pick.join(' / ')} — ${seed} bars with ${letter} bounce`; if(mode==='title') return `${seed} ${letter} Masters: ${pick[0]||letter} ${pick[1]||''}`.trim(); return `${letter} alliteration rhyme chain: ${chain}`; }
function generate(){ const target=document.getElementById('letter').value; const mode=document.getElementById('mode').value; const count=Math.max(1, Number(document.getElementById('count').value||5)); const seed=cleanSeed(); const letters=target==='ALL'?alphabet:[target]; let made=[]; letters.forEach(l=>{ groupsForLetter(l).slice(0,count).forEach(([key,words])=>{ made.push({phrase:makePhrase(l,key,words,mode,seed), letter:l, rhyme_key:key, words:words.slice(0,12), status:'result'}); }); }); results=results.concat(made); dedupeResults(false); renderResults(); updateStats(); setStatus(`Generated ${made.length} results.`); }
function renderResults(){ const box=document.getElementById('results'); box.innerHTML=''; results.forEach((r,i)=>{ const div=document.createElement('div'); div.className='item'; div.onclick=()=>toggleApprove(i); const words=(r.words||[]).map(w=>`<span class="badge">${escapeHTML(w)}</span>`).join(''); div.innerHTML=`<div class="phrase">${escapeHTML(r.phrase)}</div><div class="meta">Letter ${r.letter} · Rhyme key ${r.rhyme_key} · ${r.status||'result'}</div><div>${words}</div>`; box.appendChild(div); }); document.getElementById('resultsCount').textContent=results.length; }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function updateIndex(){ const idx=document.getElementById('index'); idx.innerHTML=''; alphabet.forEach(l=>{ const count=wordsForLetter(l).length; const d=document.createElement('div'); d.className='letter'; d.innerHTML=`<strong>${l}</strong><span>${count}</span>`; d.onclick=()=>{document.getElementById('letter').value=l; generate();}; idx.appendChild(d); }); }
function updateStats(){ document.getElementById('wordCount').textContent=db.length; document.getElementById('approvedCount').textContent=approved.length; document.getElementById('rejectedCount').textContent=rejected.length; document.getElementById('resultsCount').textContent=results.length; }
function setStatus(s){ document.getElementById('status').textContent=s; }
function sortResults(){ results.sort((a,b)=>(a.letter+a.rhyme_key+a.phrase).localeCompare(b.letter+b.rhyme_key+b.phrase)); renderResults(); setStatus('Sorted A–Z.'); }
function dedupeResults(render=true){ const seen=new Set(); results=results.filter(r=>{ const k=r.phrase.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; }); if(render){renderResults(); updateStats(); setStatus('Deduped.');} }
function clearResults(){ results=[]; renderResults(); updateStats(); setStatus('Results cleared.'); }
function clearAll(){ results=[]; approved=[]; rejected=[]; renderResults(); updateStats(); setStatus('Library cleared, embedded words still loaded.'); }
function toggleApprove(i){ const r=results[i]; if(!r) return; r.status='approved'; approved.push(r); results.splice(i,1); renderResults(); updateStats(); setStatus('Approved.'); }
function approveVisible(){ approved=approved.concat(results.map(r=>({...r,status:'approved'}))); results=[]; renderResults(); updateStats(); setStatus('Approved visible results.'); }
function rejectVisible(){ rejected=rejected.concat(results.map(r=>({...r,status:'rejected'}))); results=[]; renderResults(); updateStats(); setStatus('Rejected visible results.'); }
function exportRows(){ return approved.length ? approved : results; }
function download(name,text,type='text/plain'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportTXT(){ download('rhyming-writing-masters-machine.txt', exportRows().map(r=>r.phrase).join('\n')); }
function exportJSON(){ download('rhyming-writing-masters-machine.json', JSON.stringify({title:'RHYMING WRITING MASTERS MACHINE', words:db, results:exportRows()},null,2),'application/json'); }
function exportCSV(){ const rows=[['phrase','letter','rhyme_key','words','status'], ...exportRows().map(r=>[r.phrase,r.letter,r.rhyme_key,(r.words||[]).join('|'),r.status||'result'])]; const csv=rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'); download('rhyming-writing-masters-machine.csv', csv, 'text/csv'); }
function saveLocal(){ localStorage.setItem('rwmm_state', JSON.stringify({db,results,approved,rejected})); setStatus('Saved in this browser.'); }
function loadLocal(){ const s=localStorage.getItem('rwmm_state'); if(!s) return setStatus('No saved local state found.'); const o=JSON.parse(s); db=o.db||db; results=o.results||[]; approved=o.approved||[]; rejected=o.rejected||[]; updateIndex(); renderResults(); updateStats(); setStatus('Loaded from this browser.'); }
function importFile(e){ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=>{ const text=reader.result; try { if(file.name.toLowerCase().endsWith('.json')){ const obj=JSON.parse(text); const arr=Array.isArray(obj)?obj:(obj.records||obj.words||obj.data||[]); db=arr.map(normalizeRecord).filter(r=>r.word); } else { const lines=text.trim().split(/\r?\n/); const head=lines.shift().split(',').map(h=>h.trim().replace(/^"|"$/g,'')); db=lines.map(line=>{ const cols=line.match(/("(?:""|[^"])*"|[^,]+)/g)||[]; const r={}; head.forEach((h,i)=>r[h]=String(cols[i]||'').replace(/^"|"$/g,'').replaceAll('""','"')); return normalizeRecord(r); }).filter(r=>r.word); } updateIndex(); updateStats(); setStatus(`Imported ${db.length} records.`); } catch(err) { setStatus('Import failed: '+err.message); } }; reader.readAsText(file); }
init();
</script>
